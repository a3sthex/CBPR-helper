# Production HTTPS reverse proxy for NC//NET.
#
# 1. Replace every YOUR_DOMAIN with the real DNS name.
# 2. Obtain a certificate before enabling this file, for example:
#      sudo systemctl stop nginx
#      sudo certbot certonly --standalone -d YOUR_DOMAIN
#      sudo systemctl start nginx
# 3. Install this file in sites-available, link it from sites-enabled, then run:
#      sudo nginx -t && sudo systemctl reload nginx
#
# The Python service installed by install.sh listens on 127.0.0.1:8000 only.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN;

    ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 4m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
