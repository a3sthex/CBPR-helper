# CBPR Helper за nginx (порт 80 -> 8000).
# Установка:
#   sudo cp deploy/nginx-cbpr.conf /etc/nginx/sites-available/cbpr
#   sudo ln -sf /etc/nginx/sites-available/cbpr /etc/nginx/sites-enabled/cbpr
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Затем, если есть домен, HTTPS одной командой:
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d твой-домен.ru

server {
    listen 80;
    server_name _;   # замени на свой домен, напр.: cbpr.example.ru

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
